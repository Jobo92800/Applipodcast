[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# --- Routes de l'API ---------------------------------------------------------
[[redirects]]
  from = "/api/parcours"
  to = "/.netlify/functions/parcours"
  status = 200
[[redirects]]
  from = "/api/audio"
  to = "/.netlify/functions/audio"
  status = 200
[[redirects]]
  from = "/api/progression"
  to = "/.netlify/functions/progression"
  status = 200
[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200
[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

# --- Espace thérapeute -------------------------------------------------------
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
